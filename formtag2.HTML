<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Forms: Complete Interactive Controls Catalog</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --input-bg: #090d16;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--accent); font-size: 2.2rem; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        fieldset {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            grid-column: span 2;
        }
        legend {
            color: var(--accent);
            font-weight: bold;
            padding: 0 8px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        button[type="submit"] {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }
        button[type="submit"]:hover {
            background: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
        }
        nav.nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        a.nav-link { color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav-bar">
            <a href="lec7.html" class="nav-link">← Lecture 7: Tables</a>
            <span>HTML5 Curriculum: Forms</span>
            <a href="HTML5/YoutubeSessions/part6.html" class="nav-link">Forms Masterclass →</a>
        </nav>

        <div class="card">
            <header>
                <h1>HTML5 Modern Form Controls & Validation</h1>
                <p style="color: var(--text-muted);">Interactive registration interface utilizing HTML5 semantic inputs, validation patterns, and fieldsets.</p>
            </header>

            <form action="Formtag1_extension.html" method="GET">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullname">Full Name *</label>
                        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required minlength="3">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" pattern="[0-9+() -]{7,}">
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>

                    <div class="form-group">
                        <label for="favcolor">Brand Theme Color</label>
                        <input type="color" id="favcolor" name="favcolor" value="#0284c7" style="height: 44px; padding: 4px; cursor: pointer;">
                    </div>

                    <div class="form-group">
                        <label for="skillrange">Proficiency Level (1 - 100)</label>
                        <input type="range" id="skillrange" name="skillrange" min="1" max="100" value="80" style="margin-top: 10px;">
                    </div>

                    <fieldset>
                        <legend>Select Your Track</legend>
                        <div class="radio-group">
                            <label><input type="radio" name="track" value="frontend" checked> Frontend Engineer</label>
                            <label><input type="radio" name="track" value="fullstack"> Full-Stack Developer</label>
                            <label><input type="radio" name="track" value="uiux"> UI/UX Designer</label>
                        </div>
                    </fieldset>

                    <div class="form-group full-width">
                        <label for="bio">Bio & Learning Goals</label>
                        <textarea id="bio" name="bio" rows="3" placeholder="Describe your coding journey..."></textarea>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit">Submit Registration →</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
