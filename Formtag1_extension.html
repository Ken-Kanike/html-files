<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirmation | Success</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 25px; }
        a {
            background: #0284c7;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            transition: all 0.2s ease;
        }
        a:hover { background: #0369a1; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h2>Registration Submitted!</h2>
        <p>Your HTML5 form submission was processed successfully with all parameter validations verified.</p>
        <a href="formtag2.HTML">← Return to Form Controls</a>
    </div>

</html>
