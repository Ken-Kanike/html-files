<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background-color: white;
        }
        .container{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            animation: float 3s ease-out infinite;
        }
        @keyframes float{
            50%{
                transform: translateY(60px);
            }
        }
        #shadow{
            position: absolute;
            width: 200px;
            height: 20px;
            top: 130%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            filter: blur(3px);
            animation: shrink 3s ease-out infinite;
        }
        @keyframes shrink {
            0%{ width: 30%;}
            50%{ width: 60%;}
            100%{ width: 30%;}
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./Image Assets/Forage-Logo.png" alt="img"/>
        <span id="shadow"></span>
    </div>
</body>
</html>
