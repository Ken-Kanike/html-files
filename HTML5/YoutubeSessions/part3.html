<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Frontend Developer">
    <meta name="description" content="Learning HTML.">
    <link rel="icon" href="images/JStechnologieslogo.png" type="image/x-icon">
    <link rel="stylesheet" href="part2main.css" type="text/css">
    <title>Working with images</title>
</head>
<body>
    <!--br * 15 + tab-->

    <h3>Beautiful places</h3>
    <ul>
        <li>
            <p>
                Beautiful snow mountains 
            </p>
            <img src="images/snow.jpeg" alt="image not available" title="Snowscape" width="474" height="266" loading="lazy"><!-- lazy loading =>  inspect => >>  => network => disable cache => image => refresh page -->
        </li>
        <li>
            <p>
                Marvolous city lights
            </p>
            <figure>
                <img src="images/city.jpeg" alt="image not available" height="266" width="474" title="Citylights">
                <figcaption>
                    isnt it amazing ?
                </figcaption>
            </figure>
        </li>
        <li>
            <p>
                Amazing lakes 
            </p>
            <img src="images/lake.jpeg" alt="image not available" width="474" height="266" title="lake" >
            <figure>
                <figcaption>
                    lakes are soothing
                </figcaption>
                <p>
                    <code>
                        &lt;h1&gt;Hello World!&lt;/h1&gt;
                    </code>
                </p>
            </figure>
        </li>
    </ul>
    
</body>
</html>
