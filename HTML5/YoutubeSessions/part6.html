<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Frontend Developer">
    <meta name="description" content="Learning HTML.">
    <link rel="icon" href="images/JStechnologieslogo.png" type="image/x-icon">
    <link rel="stylesheet" href="part6main.css" type="text/css">
    <title>Forms and input</title>
</head>
<body>
    <h2>Contact me</h2>
    <p>Enter info</p>
    <form action="https://httpbin.org/get" method="get">

        <fieldset> <!-- makes a diffrent section -->
            
            <!-- makes a different group with box-->

            <legend>Personal info</legend>
            <p>
                <label for="firstName">First Name </label>
                <input type="text" name="firstName" id="firstName" placeholder="Enter first name " autocomplete="on" required autofocus >
                <!-- autocomplete  remembers the previous inputs and suggest them  -->
                <!-- required makes the input field and * field -->
                <!-- autofocus moves the curser to input as soon aas the form is loaded  , a form cannot have more then one autofocus -->
                <!-- ctrl + d   to change names -->
                <!--shift + alt + down arrow  to copy para -->
            </p>
    
            <p>
                <label for="lastName">Lastst Name </label>
                <input type="text" name="lastName" id="lastName" placeholder="Enter last name " autocomplete="on" required>
            </p>
            
            <p>
                <label for="password">Password </label>
                <input type="password" name="password" id="password" placeholder="Enter password " required>
            </p>
    
            <p>
                <label for="phone">Phone number</label>
                <input type="tel" name="phone" id="phone" placeholder="0000000000"  pattern="[0-9]{3}[0-9]{3}[0-9]{4}" required>
            </p>
    
            <p>
                <label for="decade">Favorite Decade </label>
                <input type="number" name="decade" id="decade" min="1950" max="2023" step="10" value="1980">
            </p>
    
            <p>
                <label for="Language1">Language You want to learn</label>
                <input type="text" name="language1" id="language1" list="language1-list">
                <datalist id="language1-list">
                    <option value="c"></option>
                    <option value="c++"></option>
                    <option value="java"></option>
                    <option value="python"></option>
                    <option value="other"></option>
                </datalist>
            </p>
    
        <!-- 
            select code lines to be commented 
            shift + alt + A for a toggle block comment
        -->
            <h5>Another way to take multiplelist input </h5>
    
            <p>
                <label for="language">Language You want to learn </label>
                <select name="language" id="language" multiple size>
    
                    <optgroup label="Languages">
                        <option value="c">C</option>
                        <option value="c++">C++</option>
                        <option value="java">Java</option>
                        <option value="python" selected>Python</option>
                        <option value="html">HTML</option>
                        <option value="other">Other</option>
                    </optgroup>
                    
                    <optgroup label="Frameworks">
                        <option value="react">React</option>
                        <option value="ruby">Ruby</option>
                        <option value="other">Other</option>
                    </optgroup>
                    
                </select>
            </p> 


        </fieldset> 
        <br>
        <fieldset>
            <legend>What your intrested to learn</legend>

            <p>
                <input type="checkbox" name="skill" id="webDevelopment" value="webDevelopment">
                <label for="webDevelopment">Web Development</label>
            </p>

            <p>
                <input type="checkbox" name="skill" id="appDevelopment" value="appDevelopment">
                <label for="appDevelopment">App Development</label>
            </p>

            <p>
                <input type="checkbox" name="skill" id="digitalMarketting" value="digitalMarketting">
                <label for="digitalMarketting">Digital Marketting</label>
            </p>

        </fieldset>

        <br>

        <fieldset>
            <legend>Skills you have already learned</legend>

            <p>
                <input type="radio" name="knownskills" id="basic" value="basic" >
                <label for="basic"> Basic C and HTML</label>
            </p>

            <p>
                <input type="radio" name="knownskills" id="intermidiate" value="intermidiate" >
                <label for="intermidiate">General Base :C,C++,HTML,CSS</label>
            </p>

            <p>
                <input type="radio" name="knownskills" id="fresherDevop" value="fresherDevop" >
                <label for="fresherDevop">Advanced :Java ,Python , Networking , CSS </label>
            </p>
            
             <!-- having name field same in all radio buttons allow to select only one option . radio button with different name fiellds can be allowed to select multiple options -->

        </fieldset>
        
        <br>

        <fieldset>
            <legend>Send me a note </legend>
            <p>
                <label for="message">Your message:</label>
                <br>
                <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here "></textarea>
            </p>
        </fieldset>
        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="submit" formaction="https://httpbin.org/post" formmethod="post">Post</button>

    </form>
    
</body>
</html>
