<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Frontend Developer">
    <meta name="description" content="Learning HTML.">
    <link rel="icon" href="images/JStechnologieslogo.png" type="image/x-icon">
    <link rel="stylesheet" href="part5main.css" type="text/css">
    <title>Tables</title>
</head>
<body>

<h2><mark> My Coding Schedule </mark></h2>
<hr>

<table>
    <caption>My Daily Shedule</caption>
    <!--      table header     -->
    <thead>
        <tr>
            <th>&nbsp;</th>
            <th scope="col">Time</th>
            <th scope="col">Activity</th>
        </tr>
    </thead>


    <!---     Table body      -->
    <tbody>
        <tr>
            <th scope="row">Morning</th>
            <td>
                <time datetime="09:00">9am</time>-<time datetime="11:000">11am</time>
            </td>
            <td>
                Working at Offfice
            </td>
        </tr>
        <tr>
            <th scope="row">Break</th>
            <td>
                <time datetime="11:00">11am</time>-<time datetime="12:00">12pm</time>
            </td>
            <td>
                Travelling back home and Eat
            </td>
        </tr>
        <tr>
            <th scope="row">Afternoon</th>
            <td>
                <time datetime="12:00">12pm</time>-<time datetime="17:00">5pm</time>
            </td>
            <td>
                Study online 
            </td>
        </tr>
        <tr>
            <th scope="row">Evening</th>
            <td rowspan="2">All other time </td>
            <td colspan="2">Free time </td>
        </tr>
        <tr>
            <th scope="row">Night</th>
            <td scope="row">Sleep</td>
        </tr>
    </tbody>


    <!--    table footer    -->
    <tfoot> <!--- usually includes total row-->
        <tr>
            <td colspan="3">Code ~ Eat ~ Sleep ~ Repeat</td>
        </tr>
    </tfoot>

</table>
</body>
</html>
